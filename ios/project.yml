# Florsent iOS. Generate the Xcode project with `xcodegen generate` (Florsent.xcodeproj is not
# committed). Identifiers and the team come from Config.xcconfig.
name: Florsent
options:
  bundleIdPrefix: app.florsent
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  FlorsentKit:
    path: FlorsentKit

targets:
  Florsent:
    type: application
    platform: iOS
    sources:
      - path: Florsent
        excludes: [PrivacyInfo.xcprivacy]
      - path: Florsent/PrivacyInfo.xcprivacy # privacy manifest (App Store required-reason APIs)
        buildPhase: resources
      - path: ScreenTimeShared
    dependencies:
      - package: FlorsentKit
        product: FlorsentKit
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - target: FlorsentMonitor
      - target: FlorsentShieldConfig
      - target: FlorsentShieldAction
      - target: FlorsentReport
    entitlements:
      path: Florsent/Florsent.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(FLORSENT_APP_GROUP)]
    info:
      path: Florsent/Info.plist
      properties:
        CFBundleDisplayName: Florsent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        FlorsentAppGroup: $(FLORSENT_APP_GROUP)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad: every orientation and any window size (layouts keep a readable column width).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLORSENT_BUNDLE_ID)
        PRODUCT_NAME: Florsent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  FlorsentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FlorsentTests]
    dependencies:
      - target: Florsent
      - package: FlorsentKit
        product: FlorsentKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLORSENT_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Florsent.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Florsent
        BUNDLE_LOADER: $(TEST_HOST)

  FlorsentMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: FlorsentMonitor
        excludes: [PrivacyInfo.xcprivacy]
      - path: FlorsentMonitor/PrivacyInfo.xcprivacy # privacy manifest (App Store required-reason APIs)
        buildPhase: resources
      - path: ScreenTimeShared
    dependencies:
      - package: FlorsentKit
        product: FlorsentCore
      - sdk: DeviceActivity.framework
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
    entitlements:
      path: FlorsentMonitor/FlorsentMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(FLORSENT_APP_GROUP)]
    info:
      path: FlorsentMonitor/Info.plist
      properties:
        CFBundleDisplayName: Florsent Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlorsentAppGroup: $(FLORSENT_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FlorsentMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLORSENT_BUNDLE_ID).monitor
        # Runs under a ~6 MB memory ceiling: smallest code, Foundation-only dependencies.
        SWIFT_OPTIMIZATION_LEVEL: -Osize
        SWIFT_COMPILATION_MODE: wholemodule
        APPLICATION_EXTENSION_API_ONLY: YES

  FlorsentShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: FlorsentShieldConfig
        excludes: [PrivacyInfo.xcprivacy]
      - path: FlorsentShieldConfig/PrivacyInfo.xcprivacy # privacy manifest (App Store required-reason APIs)
        buildPhase: resources
    dependencies:
      - package: FlorsentKit
        product: FlorsentCore
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
    entitlements:
      path: FlorsentShieldConfig/FlorsentShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(FLORSENT_APP_GROUP)]
    info:
      path: FlorsentShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: Florsent Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlorsentAppGroup: $(FLORSENT_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FlorsentShieldConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLORSENT_BUNDLE_ID).shield-config
        SWIFT_OPTIMIZATION_LEVEL: -Osize
        APPLICATION_EXTENSION_API_ONLY: YES

  FlorsentShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: FlorsentShieldAction
        excludes: [PrivacyInfo.xcprivacy]
      - path: FlorsentShieldAction/PrivacyInfo.xcprivacy # privacy manifest (App Store required-reason APIs)
        buildPhase: resources
      - path: ScreenTimeShared
    dependencies:
      - package: FlorsentKit
        product: FlorsentCore
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - sdk: FamilyControls.framework
    entitlements:
      path: FlorsentShieldAction/FlorsentShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(FLORSENT_APP_GROUP)]
    info:
      path: FlorsentShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Florsent Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlorsentAppGroup: $(FLORSENT_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FlorsentShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLORSENT_BUNDLE_ID).shield-action
        SWIFT_OPTIMIZATION_LEVEL: -Osize
        APPLICATION_EXTENSION_API_ONLY: YES

  FlorsentReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: FlorsentReport
        excludes: [PrivacyInfo.xcprivacy]
      - path: FlorsentReport/PrivacyInfo.xcprivacy # privacy manifest (App Store required-reason APIs)
        buildPhase: resources
    dependencies:
      - package: FlorsentKit
        product: FlorsentCore
      - sdk: DeviceActivity.framework
    entitlements:
      path: FlorsentReport/FlorsentReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(FLORSENT_APP_GROUP)]
    info:
      path: FlorsentReport/Info.plist
      properties:
        CFBundleDisplayName: Florsent Report
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlorsentAppGroup: $(FLORSENT_APP_GROUP)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLORSENT_BUNDLE_ID).report
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  Florsent:
    build:
      targets:
        Florsent: all
    test:
      gatherCoverageData: false
      targets:
        - FlorsentTests
        - package: FlorsentKit/FlorsentCoreTests
        - package: FlorsentKit/FlorsentKitTests
    run:
      config: Debug
